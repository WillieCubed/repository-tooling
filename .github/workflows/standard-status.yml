# Inspects effective host policy for this repository, without a project catalog.
# Package adoption is an explicit optional check. Repository-scoped tokens may not
# read owner account capabilities; unavailable discovery remains unverified.
name: Standard status

on:
  schedule:
    - cron: '47 14 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  status:
    name: Check repositories
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Report drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: node standards/status.ts
