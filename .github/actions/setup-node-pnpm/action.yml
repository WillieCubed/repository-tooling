# Managed by WillieCubed/repository-tooling. Do not edit this file;
# `pnpm check:repository-tooling` fails on local changes.
name: Setup Node + pnpm
description: Install the repository's pinned pnpm, cache its store, and install from the lockfile.

runs:
  using: composite
  steps:
    # packageManager in package.json is the one version source; pnpm/action-setup
    # reads it when no version input is supplied.
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: package.json
        cache: pnpm
        registry-url: https://npm.pkg.github.com
        scope: '@williecubed'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}
