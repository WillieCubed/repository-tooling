  '@eslint/js': 10.0.1
  '@playwright/test': 1.64.1
  '@tailwindcss/vite': 4.3.3
  '@types/node': 24.19.2
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.1.2
  astro: 7.4.2
  cf: 1.0.0-beta.21
  eslint: 10.13.0
