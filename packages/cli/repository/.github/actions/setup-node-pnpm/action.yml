name: Setup Node + pnpm
description: Install the repository's pinned pnpm, cache its store, and install from the lockfile.

runs:
  using: composite
  steps:
    # setup-node writes an .npmrc that reads the registry token from NODE_AUTH_TOKEN, and pnpm
    # warns in every later step that runs without it. The job's own token is the one the install
    # uses, so every step in the job gets it; steps that set it themselves set the same value.
    - name: Export the registry token
      shell: bash
      run: echo "NODE_AUTH_TOKEN=${{ github.token }}" >> "$GITHUB_ENV"

    # packageManager in package.json is the one version source; pnpm/action-setup
    # reads it when no version input is supplied.
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: package.json
        cache: pnpm
        registry-url: https://npm.pkg.github.com
        scope: '@williecubed'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}
